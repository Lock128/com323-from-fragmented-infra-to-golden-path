name: Release

# Manual release: Actions > Release > Run workflow.
# Type-checks both CDK apps, tests the managed one, packages the repository and
# publishes a GitHub release with a version tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v1.0.0 or v1.1.0-rc.1"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Version must look like v1.2.3 or v1.2.3-rc.1, got: $VERSION" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if the tag already exists
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Type-check the CDK apps
        run: |
          for d in eks-infrastructure eks-infrastructure-managed; do
            (cd "$d" && npm ci && npm run build)
          done

      - name: Test the managed CDK app
        working-directory: eks-infrastructure-managed
        run: npm test

      - name: Package release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release
          git archive --format=zip    --prefix="com323-${VERSION}/" -o "release/com323-${VERSION}.zip"    HEAD
          git archive --format=tar.gz --prefix="com323-${VERSION}/" -o "release/com323-${VERSION}.tar.gz" HEAD
          (cd release && sha256sum * > "SHA256SUMS-${VERSION}.txt")
          ls -lh release

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--target "$GITHUB_SHA" --title "COM323 $VERSION" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "$VERSION" release/* "${args[@]}"
