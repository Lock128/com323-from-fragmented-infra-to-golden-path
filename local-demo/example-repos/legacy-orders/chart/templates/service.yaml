apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    app: {{ .Values.service.name }}
    lockhead.cloud/team: {{ .Values.service.team }}
spec:
  selector:
    app: {{ .Values.service.name }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.containerPort }}
