apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    app: {{ .Values.service.name }}
    lockhead.cloud/team: {{ .Values.service.team }}
spec:
  selector:
    app: {{ .Values.service.name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      # Follow whichever container is actually running: the real app on
      # app.containerPort (8080), or the offline nginx fallback on containerPort (80).
      targetPort: {{ if and .Values.app.enabled .Values.app.repository }}{{ .Values.app.containerPort }}{{ else }}{{ .Values.containerPort }}{{ end }}
