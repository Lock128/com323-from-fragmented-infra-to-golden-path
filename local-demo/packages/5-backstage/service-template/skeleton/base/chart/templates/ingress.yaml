{{- if .Values.ingress.enabled }}
# Exposes the service through the idpbuilder ingress-nginx controller on the
# *.cnoe.localtest.me wildcard (same pattern Argo CD and Gitea use). Reachable at
#   https://{{ .Values.service.name }}.cnoe.localtest.me:8543
# No port-forward needed. Gate with ingress.enabled=false to skip.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.service.name }}
  labels:
    app: {{ .Values.service.name }}
    lockhead.cloud/team: {{ .Values.service.team }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | default (printf "%s.cnoe.localtest.me" .Values.service.name) }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.service.name }}
                port:
                  number: {{ .Values.service.port | default 80 }}
{{- end }}
